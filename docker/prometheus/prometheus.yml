global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'reusehub-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:5000']
        labels:
          app: 'reusehub'
          env: 'production'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']
        labels:
          app: 'reusehub'
          env: 'production'
