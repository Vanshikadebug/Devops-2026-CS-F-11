# ReuseHub - nginx serves the SPA and proxies the API.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Forward API calls to the api service on the compose network.
  location /api/ {
    proxy_pass http://api:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Uploaded listing photos live on the api container's volume.
  location /uploads/ {
    proxy_pass http://api:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Photos are content-addressed by a random name, so they never change.
    expires 30d;
    add_header Cache-Control "public";
  }

  # Uploads can be larger than nginx's 1MB default request body.
  client_max_body_size 16m;

  # Long-cache fingerprinted assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: every unmatched path renders index.html so client
  # routing (/admin, /items/7) works on a hard refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
