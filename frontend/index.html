<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Shown by search engines and when the link is shared. -->
    <meta
      name="description"
      content="ReuseHub - list items you no longer need so others can reuse them instead of throwing them away."
    />

    <title>ReuseHub · Give your things a second life</title>

    <!-- Restore the chosen colour theme before first paint (no flash). -->
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem('rh-theme') || 'red' } catch (e) {}
    </script>
  </head>
  <body>
    <!-- React mounts the whole application into this one element.
         It is deliberately empty: everything is rendered by JS. -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
